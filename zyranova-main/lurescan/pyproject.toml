[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lurescan"
version = "0.1.0"
description = "Static scanner for repositories delivered through fake blockchain and Web3 job offers"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
lurescan = "lurescan.cli:main"

[tool.setuptools]
packages = ["lurescan"]
